$schema: "https://json-schema.org/draft/2020-12/schema"
title: Constraint
type: object
additionalProperties: false
required:
  - id
  - entity_type
  - schema_version
  - constraint_type
  - constraint_status
  - statement
  - basis_refs
allOf:
  - if:
      properties:
        placeholder:
          const: true
      required:
        - placeholder
    then:
      properties:
        basis_refs:
          type: array
    else:
      properties:
        basis_refs:
          type: array
          minItems: 1
properties:
  id:
    type: string
    pattern: "^con_[a-z0-9_]+$"
  entity_type:
    const: constraint
  schema_version:
    type: string
  constraint_type:
    type: string
    enum: [physical, temporal, geometric, operational, search_coverage]
  constraint_status:
    type: string
    enum: [hard, soft, disputed, derived]
  placeholder:
    type: boolean
  statement:
    type: string
  basis_refs:
    type: array
    items:
      type: string
      pattern: "^(src|art|clm|con)_[a-z0-9_]+$"
  evaluation_method:
    type: string
  applicability_notes:
    type: string
  uncertainty:
    type: object
    additionalProperties: false
    properties:
      uncertainty_type:
        type: string
      uncertainty_magnitude:
        oneOf:
          - type: string
          - type: number
      uncertainty_notes:
        type: string
