$schema: "https://json-schema.org/draft/2020-12/schema"
title: Registry
type: object
additionalProperties: false
required:
  - id
  - entity_type
  - schema_version
  - registry_type
  - items
properties:
  id:
    type: string
    pattern: "^reg_[a-z0-9_]+$"
  entity_type:
    const: registry
  schema_version:
    type: string
  registry_type:
    type: string
  description:
    type: string
  items:
    type: array
    items:
      type: object
      additionalProperties: true
