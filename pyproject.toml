[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mh370-investigation-engine"
version = "0.1.0"
description = "Spec-first public-evidence investigation framework for MH370."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.22.0",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mh370_investigation_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
